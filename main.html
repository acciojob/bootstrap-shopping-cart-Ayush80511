
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #fff;
            font-family: Arial, sans-serif;
        }

        .block-heading {
            text-align: center;
            margin-bottom: 40px;
            color: #3b99e0;
        }

        .product {
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .product img {
            max-width: 120px;
        }

        .product h5 {
            color: #333;
        }

        .summary {
            padding: 30px;
            border-top: 2px solid #5ea4f3;
            border-bottom: 1px solid #eee;
            background-color: #f7fbff;
        }

        .summary h3 {
            color: #3b99e0;
            margin-bottom: 25px;
        }

        .summary .btn {
            width: 100%;
            margin-top: 20px;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <!-- Page Heading -->
        <div class="block-heading">
            <h1>Shopping Cart</h1>
            <p>Choose your products and complete your purchase.</p>
        </div>

        <!-- Main Layout -->
        <div class="row">

            <!-- Products -->
            <div class="col-lg-8">

                <!-- Product 1 -->
                <div class="product">
                    <div class="row align-items-center">

                        <div class="col-md-4">
                            <img
                                src="https://via.placeholder.com/120"
                                class="img-fluid"
                                alt="Product 1">
                        </div>

                        <div class="col-md-8">
                            <h5>Product Name</h5>
                            <p class="text-muted">
                                Product description goes here.
                            </p>
                            <p class="price">$20.00</p>
                        </div>

                    </div>
                </div>

                <!-- Product 2 -->
                <div class="product">
                    <div class="row align-items-center">

                        <div class="col-md-4">
                            <img
                                src="https://via.placeholder.com/120"
                                class="img-fluid"
                                alt="Product 2">
                        </div>

                        <div class="col-md-8">
                            <h5>Another Product</h5>
                            <p class="text-muted">
                                Product description goes here.
                            </p>
                            <p class="price">$30.00</p>
                        </div>

                    </div>
                </div>

                <!-- Product 3 -->
                <div class="product">
                    <div class="row align-items-center">

                        <div class="col-md-4">
                            <img
                                src="https://via.placeholder.com/120"
                                class="img-fluid"
                                alt="Product 3">
                        </div>

                        <div class="col-md-8">
                            <h5>Third Product</h5>
                            <p class="text-muted">
                                Product description goes here.
                            </p>
                            <p class="price">$25.00</p>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Summary -->
            <div class="col-lg-4">

                <div class="summary">

                    <h3>Summary</h3>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Subtotal</span>
                        <span>$75.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Shipping</span>
                        <span>$5.00</span>
                    </div>

                    <div class="d-flex justify-content-between border-top pt-3">
                        <strong>Total</strong>
                        <strong>$80.00</strong>
                    </div>

                    <button class="btn btn-primary">
                        Checkout
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
